<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" role="img" aria-label="forum aktywne strefy">
  <!--
    Wektorowa rekonstrukcja logo. Jeśli masz oryginalny plik PNG/SVG,
    podmień ten plik zachowując nazwę logo.svg.
  -->
  <defs>
