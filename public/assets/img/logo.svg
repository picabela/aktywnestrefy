  </defs>

  <!-- Zielony dymek (z tyłu) -->
  <path class="t-green" d="M52 18h96a26 26 0 0 1 26 26v64a26 26 0 0 1-26 26h-20l14 26-40-26H52a26 26 0 0 1-26-26V44a26 26 0 0 1 26-26z" transform="translate(16 8)"/>
